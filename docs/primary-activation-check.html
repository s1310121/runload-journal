<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Primary activation browser check</title>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:1100px;margin:32px auto;padding:0 20px;line-height:1.6}button{font:inherit;padding:12px 18px;margin:4px}pre{white-space:pre-wrap;background:#f5f5f5;border-left:6px solid #111;padding:18px;border-radius:10px;min-height:120px}.pass{border-left-color:#137333}.fail{border-left-color:#b3261e}.note{max-width:900px}
  </style>
</head>
<body>
  <h1>Primary activation browser check</h1>
  <p class="note">このページはPrimary activation候補の検証専用です。保存済みの過去記録を再計算しません。通常アプリの保存確認は、同じLive Server・同じポートで <code>index.html</code> から新しい走行記録を1件保存した後に行ってください。</p>
  <p>
    <button id="self-test" type="button">1. Browser workflow self-test</button>
    <button id="persistence-test" type="button">2. Check normal-app Primary persistence</button>
    <button id="backup-test" type="button">3. Check backup integrity</button>
  </p>
  <pre id="output">ボタンを選択してください。</pre>
  <script type="module" src="./primary-activation-check.js"></script>
</body>
</html>
